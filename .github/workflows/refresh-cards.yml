name: Refresh profile cards

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC / 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - render_cards.py
      - assets/**
      - requirements.txt
      - .github/workflows/refresh-cards.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install font tooling
        run: python -m pip install -r requirements.txt

      - name: Refresh public contribution data
        run: python render_cards.py --refresh

      - name: Check contribution calculations
        run: python render_cards.py --self-test

      - name: Render animated cards
        env:
          STATIC: '0'
        run: python render_cards.py

      - name: Commit updated cards and data
        run: |
          git add -- data/contributions.json cards/ README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile cards'
          git push
